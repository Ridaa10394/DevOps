apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: s13
  labels:
    app: readiness-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /ready.html
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-svc
  namespace: s13
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 80
