# Liveness demo: healthy nginx, then I delete index.html so GET / returns 403
# and kubelet restarts the container.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: s13
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
