# Startup probe demo: the container sleeps 20s before nginx starts (fake slow boot).
# startupProbe allows 30 x 2s = 60s, liveness/readiness only start after it passes.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
  namespace: s13
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["/bin/sh", "-c", "echo slow boot...; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
