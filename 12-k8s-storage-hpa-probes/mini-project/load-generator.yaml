# Deployment version of the "kubectl run load-generator" step from the brief,
# so it is easy to delete/scale and lives in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13-production-webapp
  labels:
    app: load-generator
spec:
  replicas: 3   # 1 pod is nowhere near enough to push nginx past 50% of a 100m request
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in 1 2; do
                (while true; do wget -q -O- http://web-service > /dev/null 2>&1; done) &
              done
              wait
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 300m
