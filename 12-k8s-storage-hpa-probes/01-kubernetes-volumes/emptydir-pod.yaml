# emptyDir shared by two containers in the same pod.
# writer appends a timestamp every 5s, reader (nginx) serves the same folder.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - while true; do echo "written by writer at $(date)" >> /shared/index.html; sleep 5; done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: reader
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
