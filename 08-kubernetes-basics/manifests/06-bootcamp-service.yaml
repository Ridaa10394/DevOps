# Same as: kubectl expose deployment/kubernetes-bootcamp --type=NodePort --port 8080
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-bootcamp
  namespace: s09
  labels:
    app: kubernetes-bootcamp
spec:
  type: NodePort
  selector:
    app: kubernetes-bootcamp
  ports:
    - port: 8080
      targetPort: 8080
