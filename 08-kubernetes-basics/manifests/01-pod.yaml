apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: s09
  labels:
    app: nginx-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
