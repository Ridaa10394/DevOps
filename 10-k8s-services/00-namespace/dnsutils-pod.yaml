# client pod with curl + busybox nslookup, used for all connectivity + DNS tests
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: s11
  labels:
    app: dnsutils
spec:
  containers:
    - name: dnsutils
      image: curlimages/curl:latest
      imagePullPolicy: IfNotPresent   # image is already cached on the node
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
