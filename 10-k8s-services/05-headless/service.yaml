apiVersion: v1
kind: Service
metadata:
  name: web-service-headless
  namespace: s11
  labels:
    app: web-headless
spec:
  clusterIP: None      # headless: DNS returns pod IPs directly, no virtual IP
  selector:
    app: web-headless
  ports:
    - name: web
      port: 80
      targetPort: 80
      protocol: TCP
