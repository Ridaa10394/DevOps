# a small app + service in a second namespace for the cross-namespace DNS demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s11-other
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: s11-other
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
