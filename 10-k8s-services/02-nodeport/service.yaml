apiVersion: v1
kind: Service
metadata:
  name: web-service-nodeport
  namespace: s11
  labels:
    app: web-nodeport
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180   # must be 30000-32767; 30180 to avoid clashing with other labs
      protocol: TCP
