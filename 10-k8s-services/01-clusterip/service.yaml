apiVersion: v1
kind: Service
metadata:
  name: web-service-clusterip
  namespace: s11
  labels:
    app: web-clusterip
spec:
  type: ClusterIP
  selector:
    app: web-clusterip
  ports:
    - name: http
      port: 8080        # port clients hit on the ClusterIP
      targetPort: 80    # containerPort on the nginx pods
      protocol: TCP
