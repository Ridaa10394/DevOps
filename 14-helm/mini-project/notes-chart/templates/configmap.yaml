apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}-config
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
---
# separate ConfigMap for the page so the HTML does not end up as an env var
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}-page
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  index.html: |
    <html>
    <body>
      <h1>{{ .Values.app.name }} ({{ .Values.app.environment }})</h1>
      <p>image: {{ .Values.image.repository }}:{{ .Values.image.tag }} | revision: {{ .Release.Revision }}</p>
      {{- if .Values.notes }}
      <ul>
      {{- range $i, $note := .Values.notes }}
        <li>note {{ add1 $i }}: {{ $note }}</li>
      {{- end }}
      </ul>
      {{- else }}
      <p>No notes yet.</p>
      {{- end }}
    </body>
    </html>
