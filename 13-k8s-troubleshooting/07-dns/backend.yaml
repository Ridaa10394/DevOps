# backend lives in its own namespace: s14-dns-backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: s14-dns-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: s14-dns-backend
spec:
  selector:
    app: orders
  ports:
    - port: 80
      targetPort: 80
