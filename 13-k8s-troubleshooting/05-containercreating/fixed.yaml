# FIX: create the ConfigMap and Secret the pod mounts
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-config
data:
  index.html: |
    <h1>Hello from site-config ConfigMap</h1>
---
apiVersion: v1
kind: Secret
metadata:
  name: site-tls
type: Opaque
stringData:
  tls.key: "dummy-key-for-demo"
---
apiVersion: v1
kind: Pod
metadata:
  name: mount-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: site-config
          mountPath: /usr/share/nginx/html
        - name: tls
          mountPath: /etc/tls
          readOnly: true
  volumes:
    - name: site-config
      configMap:
        name: site-config
    - name: tls
      secret:
        secretName: site-tls
