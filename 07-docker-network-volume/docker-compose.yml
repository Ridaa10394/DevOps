services:
  frontend:
    image: nginx:alpine
    container_name: frontend
    networks:
      - frontend-net

  backend:
    image: alpine:latest
    container_name: backend
    command: sleep infinity
    networks:
      - frontend-net
      - backend-net

  database:
    image: mysql:8.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  isolated-net:
    driver: bridge
