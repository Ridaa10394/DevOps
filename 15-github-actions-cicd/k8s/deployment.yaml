apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-s16-app
  namespace: s16
  labels:
    app: devops-s16-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-s16-app
  template:
    metadata:
      labels:
        app: devops-s16-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          # IMAGE_PLACEHOLDER is swapped by the deploy job (sed) for the image it just built
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
