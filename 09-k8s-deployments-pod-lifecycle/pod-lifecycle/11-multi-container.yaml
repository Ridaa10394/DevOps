apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-multi-container
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
    - name: sidecar
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do echo 'Sidecar is running'; sleep 10; done"]
