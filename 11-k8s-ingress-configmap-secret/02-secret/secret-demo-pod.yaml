# Consumes Secrets two ways: as env vars and as files in a volume
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: api-creds
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
  volumes:
    - name: api-creds
      secret:
        secretName: api-secret          # created imperatively with kubectl create secret generic
        defaultMode: 0400
