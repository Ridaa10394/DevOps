# Demo Secret. Values are FAKE on purpose - never commit real credentials.
# stringData lets you write plain text; the API server base64-encodes it into .data for you.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: s12
  labels:
    app: s12-demo
type: Opaque
stringData:
  DB_USER: "demo_user"
  DB_PASSWORD: "demo-password-not-real"
  DB_NAME: "s12_demo_db"
