# FIX for the instructor's app/backend-with-config.yaml:
# the Deployment does envFrom: configMapRef yatri-app-config + secretRef yatri-db-secret,
# so both objects must exist in the SAME namespace as the Deployment (here: s12-trouble).
# ConfigMap keys copied from nency/session-12.../01-configmap/app-config.yaml.
# Secret values are fake demo values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  namespace: s12-trouble
  labels:
    app: yatri-backend
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  namespace: s12-trouble
  labels:
    app: yatri-backend
type: Opaque
stringData:
  POSTGRES_USER: "yatri_admin"
  POSTGRES_PASSWORD: "demo-password-not-real"
  POSTGRES_DB: "yatri_production_db"
